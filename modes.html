<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Choose your experience — PICK ONE</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/modes.css" />
</head>
<body class="bg">
  <header class="site-header">
    <div class="brand">
      <h1 class="logo">PICK ONE.</h1>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
      </nav>
    </div>
  </header>

  <main class="modes" role="main">
    <h2>CHOOSE YOUR EXPERIENCE</h2>

    <div class="modes-grid" role="list">
      <button class="mode-card" data-mode="quick" aria-label="Quick Pick — 10 questions">
        <div class="mode-icon">⚡</div>
        <h3>QUICK PICK</h3>
        <p>10 questions — A quick glimpse into your personality.</p>
      </button>

      <button class="mode-card" data-mode="deep" aria-label="Deep Dive — 40 questions">
        <div class="mode-icon">🧠</div>
        <h3>DEEP DIVE</h3>
        <p>40 questions — More choices. More patterns. A deeper result.</p>
      </button>

      <button class="mode-card" data-mode="impossible" aria-label="Impossible Choices — 20 questions">
        <div class="mode-icon">💀</div>
        <h3>IMPOSSIBLE CHOICES</h3>
        <p>20 questions — There are no good answers.</p>
      </button>

      <button class="mode-card" data-mode="love" aria-label="Love & Relationships — 20 questions">
        <div class="mode-icon">❤️</div>
        <h3>LOVE & RELATIONSHIPS</h3>
        <p>20 questions — Choices about connection, trust and relationships.</p>
      </button>

      <button class="mode-card" data-mode="life" aria-label="Life & Money — 20 questions">
        <div class="mode-icon">💰</div>
        <h3>LIFE & MONEY</h3>
        <p>20 questions — Your priorities become surprisingly obvious.</p>
      </button>
    </div>

    <div class="modes-footer">
      <a class="btn ghost" href="index.html">Back</a>
    </div>
  </main>

  <script src="js/questions.js" defer></script>
  <script src="js/game.js" defer></script>
</body>
</html>
